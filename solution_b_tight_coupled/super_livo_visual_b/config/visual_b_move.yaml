# move bag（1280x1024 bgr8 全局快门相机 + Livox CustomMsg）——方案 B 支路参数。
# 外参 Rcl/Pcl 由 FAST-Calib 标定结果回填（标定 bag：livo_bag/all_ros2，RMSE 7.9 mm）。
#
# 用法（paper_matrix 口径：方案 B 单体，同一进程内运行 LIO 与视觉支路）：
#   ros2 run super_livo_visual_b visual_b_app --ros-args \
#     --params-file third_party/Super-LIO/src/super_lio/config/livox_360.yaml \
#     --params-file solution_b_tight_coupled/super_livo_visual_b/config/visual_b_move.yaml
#
# 注意：paper_matrix 的 move 序列回放的是 move_ros2（图像 header 为主机时钟），
#   启动命令用 `-p img_time_offset:=-204262818.9974` 覆盖本文件的 0.0。
# 顶层用 /** 通配：单体进程里节点名是 super_lio（ROSWrapper 写死），
# 写成 super_livo_visual_b 时用 ros2 run 起会整块不生效。
/**:
  ros__parameters:
    # ---- 视觉支路参数（方案 A / 方案 B 共用同一套名字）----
    # rcl 会把本分支摊平成 super_livo_visual.<name>，代码侧读取时必须带这个前缀；
    # 官方 super_lio_node 不认识本分支，未声明的 override 被静默忽略，故同一份文件
    # 直接喂 super_lio_node 也能跑（这就是本仓库统一参数格式的目的）。
    super_livo_visual:
        image_topic: /left_camera/image
        imu_topic: /livox/imu
        cam_width: 1280
        cam_height: 1024
        cam_fx: 7.0863125924497740e+02
        cam_fy: 7.0871513587278127e+02
        cam_cx: 6.4449372682521789e+02
        cam_cy: 4.9588359175254533e+02
        cam_d: [5.4466418090825280e-02, -4.5147373415016401e-02,
                8.5461102120314711e-06, 1.0486594840736336e-03]
        # LiDAR -> Camera（p_cam = Rcl * P_lidar + Pcl），与方案 A 同一标定结果
        # FAST-Calib 重标（all_ros2 + img_0120.png，本地标定参数，RMSE 7.9 mm）
        # holefix：真实板面 RANSAC 法向 + 前表面 + 1° 扇区最小半径重解 4 孔心 → Kabsch，
        # 四孔 3D 对应点 RMSE 3.2 mm（优于 FAST-Calib 直出的 7.9 mm）。2026-11-17 重写。
        Rcl: [-0.017100, -0.999833, -0.006427,
               0.482159, -0.002615, -0.876080,
               0.875917, -0.018080,  0.482123]
        Pcl: [0.027840, -0.172288, -0.047550]
        # 标定源覆盖（各取所长，最高优先级）：intrinsic.yaml 提供内参+畸变、
        # FAST-Calib 提供外参，读取成功则覆盖上面的 cam_*/Rcl/Pcl；留空或读取失败沿用本文件。
        calib:
          camera_intrinsic_yaml: "/home/ywj/git/Super-LIVO/config/camera_intrinsic.yaml"
          fast_calib_result: "/home/ywj/git/Super-LIVO/third_party/FAST-Calib-ROS2/output/calib_result.txt"
        img_time_offset: 0.0
        # 相机与雷达扫描存在相位差（最近邻 dt 中位 16.7ms、最大 74ms），放宽同步窗。
        color.sync_max_offset: 0.1

        # 彩色点云落盘：<save_dir>/super_livo_visual_b_colored.pcd
        pcd:
          save_dir: "/home/ywj/slam_data/output/move_b"
          # 必须 <=0（只在退出时存一次）：周期落盘发生在单线程 executor 里，
          # 200 万点写盘会阻塞约 1 s，实测直接造成 0.92 s IMU 丢包 + 图像帧丢弃，
          # 恢复后姿态/速度被伪加速度泵飞（|v| 1.69 m/s、路径多 1.2 m）。
          # 评测运行只需要最终的合并 pcd，退出时存一次即可。
          save_interval_sec: 0.0
          max_points: 20000000
