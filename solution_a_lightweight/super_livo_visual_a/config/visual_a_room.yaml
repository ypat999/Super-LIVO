# 自采 room bag（Livox Mid-360 + 1280x800 彩色相机）的相机参数覆盖项。
# 用法：
#   ros2 run super_livo_visual_a visual_a_app --ros-args \
#     --params-file $(ros2 pkg prefix super_livo_visual_a)/share/super_livo_visual_a/config/visual_a_room.yaml
# 说明：本包默认值对应 avia + OAK（640x512、img_time_offset=0.1），
#   直接用于 room bag 会因内参/外参不匹配导致 0 点着色。
# 顶层键统一用 /** 通配（官方 super_lio_node 与单体 visual_a_app 都命中，
#   写具体节点名会在另一条路径上整块静默失效）。
/**:
  ros__parameters:
    # ---- 视觉支路参数（方案 A / 方案 B 共用同一套名字）----
    # rcl 会把本分支摊平成 super_livo_visual.<name>，代码侧读取时必须带这个前缀；
    # 官方 super_lio_node 不认识本分支，未声明的 override 被静默忽略，故同一份文件
    # 直接喂 super_lio_node 也能跑（这就是本仓库统一参数格式的目的）。
    super_livo_visual:
        image_topic: /camera/color/image_raw
        cam_width: 1280
        cam_height: 800
        cam_fx: 611.5093994140625
        cam_fy: 611.7654418945312
        cam_cx: 639.8602905273438
        cam_cy: 397.16888427734375
        cam_d: [-0.030312, 0.032308, -0.0000744, -0.0003438]
        # Camera -> LiDAR（P_lidar = Rcl * P_cam + Pcl）
        Rcl: [-0.01947422, 0.0024993, 0.999807236,
              -0.999337825, -0.030789816, -0.019388109,
              0.030735424, -0.999522756, 0.003097253]
        Pcl: [0.060776872, 0.026349007, -0.069456793]
        # room bag 的 lidar 帧头即帧末，图像曝光中点与点云同时刻，无需偏移
        img_time_offset: 0.0
