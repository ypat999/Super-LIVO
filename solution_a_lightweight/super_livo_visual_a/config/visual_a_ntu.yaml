/**:
  ros__parameters:
    # ========================================================================
    # NTU VIRAL（Ouster OS1-16 + 单目灰度相机 + VectorNav VN100）
    # 数据：tools/ntuviral_prep.sh 转换后的 rosbag2（sqlite3）
    # 参数来源：third_party/FAST-LIVO2-ROS2/config/{NTU_VIRAL,camera_NTU_VIRAL}.yaml
    #          （官方为 NTU 序列专门准备了一套配置，这里与之对齐，便于公平对比）
    # ========================================================================
    image_topic: "/left/image_raw"
    odom_topic: "lio/odom"
    cloud_topic: "lio/cloud_world"
    body_cloud_topic: "lio/cloud_body_dense"
    imu_topic: "/imu/imu"

    # ---- 相机内参（752x480 Pinhole，cam_model=Pinhole，scale=1.0）----------
    scale: 1.0
    cam_width: 752
    cam_height: 480
    cam_fx: 425.0258563372763
    cam_fy: 426.7976260903337
    cam_cx: 386.0151866550880
    cam_cy: 241.9130336743440
    cam_d: [-0.288105327549552, 0.074578284234601, 0.0007784489598138802, -0.0002277853975035461]

    # ---- 外参：与官方 NTU_VIRAL.yaml 的 Rcl/Pcl 逐值相同 ----
    # 语义 p_cam = Rcl·p_lidar + Pcl（LiDAR->Camera），节点内部会自动求逆。
    Rcl: [0.0218308, 0.99976, -0.00201407,
          -0.0131205, 0.00230088, 0.999911,
          0.999676, -0.0218025, 0.0131676]
    Pcl: [0.122993, 0.0398643, -0.0577101]

    # 官方对 NTU 用 img_time_offset=0.0、lidar_time_offset=-0.1（后者属 LIO 侧）。
    # 先取 0，若着色/约束出现系统性错位再按 offset 扫描法重定。
    img_time_offset: 0.0

    # ---- 前端（灰度图，特征阈值先沿用默认）----
    klt.max_features: 150
    klt.pyramid_levels: 3
    klt.min_distance: 10.0
    klt.fb_error_threshold: 1.0
    klt.min_track_length: 3
    klt.trace_window: 5
    klt.use_fast: true
    klt.fast_threshold: 20
    klt.quality_level: 0.01
    klt.lk_window: 21

    # ---- 深度关联 ----
    depth.pixel_radius: 3
    depth.search_radius: 0.3
    depth.min_depth: 0.5
    depth.max_depth: 150.0
    depth.max_neighbors: 5
    depth.anchor_window: 5

    # ---- 重投影约束 ----
    reproj.huber_delta: 1.0
    reproj.min_constraints: 8
    reproj.max_pixel_error: 8.0
    reproj.sigma_pix: 1.5
    reproj.sigma_anchor: 0.05

    # ---- 退化门控 ----
    gate.min_tracked_features: 30
    gate.max_reprojection_rmse: 3.0
    gate.min_spread: 0.15
    gate.max_condition: 1.0e5
    gate.assist_weight: 0.3
    gate.high_weight: 0.8
    gate.assist_degeneracy: 0.3
    gate.high_degeneracy: 0.7

    # ---- 视觉更新 ----
    update.enable: true
    update.max_dx_norm: 0.5
    update.prior_rot_sigma: 0.02
    update.prior_pos_sigma: 0.05
    visual.use_exposure_pose: true

    # ---- 彩色点云（注意：NTU 相机是单目灰度，着色只会有灰度层次）----
    color.sync_max_offset: 0.05
    color.use_exposure_mid: true
    color.depth_tolerance: 0.1
    color.check_depth_edges: true
    color.edge_threshold: 0.5
    color.bilinear: true
    color.keep_best_quality: true
    color.min_quality: 0.2
    color.use_own_odom: false

    pcd.save_dir: "/home/ywj/slam_data/pcd/ntu_a"
    pcd.save_interval_sec: 30.0
    pcd.max_points: 20000000
