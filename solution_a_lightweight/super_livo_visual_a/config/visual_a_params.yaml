/**:
  ros__parameters:
    # ========================================================================
    # topic 订阅/发布（需与 Super-LIO 及 bag 的实际 topic 对齐）
    # ========================================================================
    # 图像 topic：bag 内为 /left_camera/image（注意 avia_lvi.yaml 里写的是 /oak/rgb/image_raw，不一致）
    image_topic: "/left_camera/image"
    # LiDAR 位姿：Super-LIO 发布（nav_msgs/Odometry，child_frame 标 "imu" 实为 LiDAR 位姿）
    odom_topic: "lio/odom"
    # 世界系点云：Super-LIO 发布的当前帧（用于累积局部地图 / 深度关联）
    cloud_topic: "lio/cloud_world"
    # 机体系点云：彩色点云上色与落盘用，必须是**全量**点云（不做体素抽稀）
    #   新分支 Super-LIO 提供 lio/cloud_body_dense（全分辨率 + 异步去畸变输出）
    body_cloud_topic: "lio/cloud_body_dense"

    # ========================================================================
    # 相机内参与畸变（来自 camera_pinhole.yaml，scale=0.5 后）
    #   原始：1280x1024, fx=1293.56944 fy=1293.3155 cx=626.91359 cy=522.799224
    #   scale 0.5 -> 640x512，fx/fy/cx/cy 均乘 0.5
    # ========================================================================
    scale: 0.5
    cam_width: 640
    cam_height: 512
    cam_fx: 646.78472
    cam_fy: 646.65775
    cam_cx: 313.456795
    cam_cy: 261.399612
    cam_d: [-0.076160, 0.123001, -0.00113, 0.000251]

    # ========================================================================
    # 相机-LiDAR 外参（来自 avia_lvi.yaml 的 Rcl/Pcl）
    #   语义：P_lidar = Rcl · P_cam + Pcl（即 T_lc：Camera -> LiDAR）
    # ========================================================================
    Rcl: [0.00610193, -0.999863, -0.0154172,
          -0.00615449, 0.0153796, -0.999863,
          0.999962, 0.00619598, -0.0060598]
    Pcl: [0.0194384, 0.104689, -0.0251952]

    # ========================================================================
    # 图像真实采集时刻 = header.stamp + img_time_offset（秒）
    #   该偏移**只用于取相机位姿**，不参与图像-点云配对（配对用 header.stamp，
    #   实测 |t_img_header - t_cloud| < 7 ms；若把 offset 也加到配对时刻上，
    #   0.1 s 会超出 color.sync_max_offset 使整帧被丢弃）。
    #   取值依据：用官方轨迹离线重放本管线做 0~0.15 s 扫描，1 cm 体素颜色标准差
    #   在 0.10 s 处取极小值 7.1（0.00 时 15.4，官方 PCD 5.9），且整图投影
    #   MAE = 23.6/255 与官方 PCD 完全一致。官方 avia.yaml 同为 0.1。
    #   若换 bag 后颜色整体沿运动方向错位，优先调这个值。
    # ========================================================================
    img_time_offset: 0.1

    # ========================================================================
    # 前端 KltFrontend（对应 gpt §2.2）
    # ========================================================================
    klt.max_features: 150
    klt.pyramid_levels: 3
    klt.min_distance: 10.0
    klt.fb_error_threshold: 1.0
    klt.min_track_length: 3
    klt.trace_window: 5
    klt.use_fast: true
    klt.fast_threshold: 20
    klt.quality_level: 0.01
    klt.lk_window: 21

    # ========================================================================
    # 深度关联 LidarDepthAssociation（对应 gpt §2.2）
    # ========================================================================
    depth.pixel_radius: 3
    depth.search_radius: 0.3
    depth.min_depth: 0.5
    depth.max_depth: 80.0
    depth.max_neighbors: 5
    depth.anchor_window: 5

    # ========================================================================
    # 重投影约束 ReprojectionConstraint
    # ========================================================================
    reproj.huber_delta: 1.0
    reproj.min_constraints: 8
    reproj.max_pixel_error: 8.0
    # 残差测量噪声：σ² = sigma_pix² + (f·sigma_anchor/z)²。
    # 缺这一项等价于宣称每个特征把位姿约束到 1 px（z=5 m 处仅 0.8 cm），
    # 上百个特征叠加后视觉会盖过 LiDAR 先验、一步全量拟合地图。
    reproj.sigma_pix: 1.5
    reproj.sigma_anchor: 0.05

    # ========================================================================
    # 退化门控 DegeneracyGate（对应 gpt §2.3）
    # ========================================================================
    gate.min_tracked_features: 30
    # 实测本 bag 的深度关联重投影 rmse 在 1.6~2.9 px（街道场景、地图抽稀 0.25m），
    # 原 2.0 会把绝大多数帧判为拒绝；放宽到 3.0 更贴合该数据。
    gate.max_reprojection_rmse: 3.0
    gate.min_spread: 0.15
    # 条件数在**无量纲**矩阵 S·H·S 上计算（S=diag(σ_rot,σ_pos)，见 update.prior_*）。
    # 原来直接在有量纲的 H 上算，得到的是 rad²与 m² 的单位之比而不是几何病态程度；
    # 加方差归一化后 cond 从 2e4 跳到 3e7，几乎每帧都被误判为病态而拒绝。
    gate.max_condition: 1.0e5
    gate.assist_weight: 0.3
    gate.high_weight: 0.8
    # 进入"视觉参与更新"的退化阈值。代理式退化检测（当前扫描点空间协方差，
    # ratio<0.01 才给非零值）在普通室内/街道恒为 0，所以默认 0.3 时视觉
    # 永远处于"只跟踪不更新"，自身 odom 与 lio/odom 逐位相同（实测 86.5% 完全一致）。
    # 判别实验可设 0.0 强制常开。
    gate.assist_degeneracy: 0.3
    gate.high_degeneracy: 0.7

    # ========================================================================
    # 视觉更新 VisualUpdate
    # ========================================================================
    update.enable: true
    update.max_dx_norm: 0.5
    # LiDAR 先验信息量（贝叶斯正则）。原实现解 (w·H)dx=-(w·b)，w 会被左右约掉，
    # 门控权重对 dx 大小毫无影响；加入 H_prior=diag(1/σ_rot²,1/σ_pos²) 后 w 才真正
    # 在"信 LiDAR"与"信视觉"之间插值。
    update.prior_rot_sigma: 0.02
    update.prior_pos_sigma: 0.05

    # 视觉链路是否使用图像曝光时刻的插值位姿（false=退回"最新一条 lio/odom"）。
    visual.use_exposure_pose: true

    # ========================================================================
    # 彩色点云 ColorizerPipeline（对应 gpt §2.4）
    # ========================================================================
    # 图像-扫描对齐窗口（秒）。限制的是 |t_img - t_cloud|：
    #   t_cloud = dense 云 header.stamp（扫描结束时刻），t_img = 图像曝光中点。
    # 本数据集实测 |t_img - t_cloud| = 0.4 ~ 5.2 ms（P99 = 5.1 ms），因此 0.05 s 已足够宽松
    # （原值 0.3 会把相邻帧图像也算作"匹配"，导致同一批点被不同时刻图像重复染色）。
    # 注意：该参数由两处使用 —— ①图像/点云同步窗口；②colorizer 内部位姿插值最大间隔
    # （×2.5 = 0.125s，仍大于 10Hz odom 的 0.1s 间隔，不会误伤插值）。
    color.sync_max_offset: 0.05
    color.use_exposure_mid: true
    color.depth_tolerance: 0.1
    color.check_depth_edges: true
    color.edge_threshold: 0.5
    color.bilinear: true
    color.keep_best_quality: true
    color.min_quality: 0.2

    # ========================================================================
    # 彩色地图落盘（把跑完的彩色点云输出为 PCD）
    #   每帧上色点按扫描时刻位姿变换到世界系累积，定时器周期性覆盖写同一个文件，
    #   节点退出时再存一次。输出：<save_dir>/super_livo_visual_a_colored.pcd
    # ========================================================================
    pcd.save_dir: "/home/ywj/slam_data/pcd"
    pcd.save_interval_sec: 30.0
    pcd.max_points: 20000000
